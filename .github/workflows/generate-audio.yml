name: Generate Neural Story Audio

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/stories.js'
      - 'scripts/generate_tts.py'
      - '.github/workflows/generate-audio.yml'

permissions:
  contents: write

jobs:
  generate-tts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TTS dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
          pip install edge-tts kokoro-onnx soundfile

      - name: Generate Neural Audio Files
        run: |
          python3 scripts/generate_tts.py --workers 4

      - name: Commit and Push Neural Audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio/*.mp3
          git diff --staged --quiet || git commit -m "chore(audio): update neural storytelling voices (EN, EN-slow, ES)"
          git push origin HEAD:main
