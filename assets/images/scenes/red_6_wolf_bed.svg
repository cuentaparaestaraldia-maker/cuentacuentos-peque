    <circle cx="145" cy="76" r="9" fill="#0f172a"/>
    <circle cx="68" cy="64" r="16" fill="none" stroke="#fbbf24" stroke-width="5"/>
    <circle cx="104" cy="64" r="16" fill="none" stroke="#fbbf24" stroke-width="5"/>
